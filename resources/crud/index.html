<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Records</title>
<style>
:root{font:16px "Segoe UI",system-ui,sans-serif;color:#152a31;background:#f6f7f4}*{box-sizing:border-box}body{margin:0}main{max-width:74rem;margin:auto;padding:2rem clamp(1rem,5vw,4rem)}header{border-bottom:2px solid #254747;margin-bottom:1.5rem}h1{font-size:clamp(2rem,5vw,3.5rem);margin:.3em 0}h2{font-size:1.3rem}nav,.actions{display:flex;gap:.5rem;flex-wrap:wrap}button,input{font:inherit;padding:.55rem .75rem;border:1px solid #839694;border-radius:.35rem}button{background:white;color:#143e40;cursor:pointer}button[type=submit],button[aria-pressed=true]{background:#184e50;color:white}input{width:100%;background:#fff}label{display:grid;gap:.35rem;font-weight:600}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));align-items:end;gap:1rem;background:#e5edeb;padding:1.3rem;border-radius:.5rem}section{margin:1.5rem 0}.table{overflow:auto}table{border-collapse:collapse;width:100%;background:white}th,td{text-align:left;padding:.75rem;border-bottom:1px solid #d3dedb}th{background:#dce8e5}#message{min-height:1.3em}button:focus-visible,input:focus-visible{outline:3px solid #1b706d;outline-offset:2px}
</style></head><body><main><header><h1 id="title">Records</h1></header><nav aria-label="Collections" id="collections"></nav>
<section><h2 id="form-title">Add record</h2><form id="record-form"></form></section><p id="message" role="status" aria-live="polite"></p>
<section><label>Search records<input id="search" type="search"></label><h2 id="list-title">Records</h2><div class="table"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><p id="empty">No records yet.</p></section></main><script type="module" src="/app.js"></script></body></html>
